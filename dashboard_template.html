<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Budget</title>
<style>
  :root {
    --ink: #1f1e1a;
    --ink-soft: #5a584f;
    --ink-muted: #8f8d81;
    --paper: #faf8f2;
    --card: #ffffff;
    --line: #e4e1d5;
    --green: #1d9e75;
    --green-bg: #e1f5ee;
    --amber: #ba7517;
    --amber-bg: #fbeed9;
    --red: #a32d2d;
    --red-bg: #fcebeb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 2rem 1.25rem 4rem;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    margin-bottom: 24px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .month-label { font-size: 13px; color: var(--ink-muted); }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .section { margin-bottom: 28px; }
  .people-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .people-grid > div { min-width: 0; }
  @media (max-width: 560px) { .people-grid { grid-template-columns: 1fr; } }
  .row { margin-bottom: 14px; }
  .row-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .row-amounts { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .track { height: 6px; background: #ece9dd; border-radius: 4px; overflow: hidden; }
  .bar { height: 100%; border-radius: 4px; }
  .status-label { font-size: 11px; margin-top: 3px; }
  .bar.ontrack, .status-label.ontrack { color: var(--green); }
  .track .bar.ontrack { background: var(--green); }
  .bar.close, .status-label.close { color: var(--amber); }
  .track .bar.close { background: var(--amber); }
  .bar.over, .status-label.over { color: var(--red); }
  .track .bar.over { background: var(--red); }
  .status-label.unbudgeted { color: var(--amber); }
  .track .bar.unbudgeted { width: 100% !important; background: repeating-linear-gradient(45deg, var(--amber), var(--amber) 6px, var(--amber-bg) 6px, var(--amber-bg) 12px); }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 28px; }
  .metric { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .metric-label { font-size: 12px; color: var(--ink-soft); margin: 0 0 4px; }
  .metric-value { font-size: 22px; font-weight: 600; margin: 0; font-variant-numeric: tabular-nums; }
  .metric.positive { background: var(--green-bg); }
  .metric.positive .metric-value, .metric.positive .metric-label { color: var(--green); }
  .warning-box { background: var(--red-bg); border: 1px solid #f0c9c9; border-radius: 10px; padding: 12px 16px; margin-top: 20px; font-size: 13px; color: var(--red); }
  .warning-box p { margin: 0 0 6px; font-weight: 600; }
  .generated-note { font-size: 12px; color: var(--ink-muted); margin-top: 32px; text-align: center; }
  .row-top.clickable { cursor: pointer; }
  .row-top.clickable:hover span:first-child { text-decoration: underline; }
  .expense-list { margin: 8px 0 0; padding-left: 10px; border-left: 2px solid var(--line); }
  .expense-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 6px 10px; padding: 6px 0; font-size: 12px;
  }
  .expense-info { display: flex; gap: 10px; flex: 1 1 180px; min-width: 0; color: var(--ink-soft); }
  .expense-date { flex-shrink: 0; color: var(--ink-muted); }
  .expense-desc { flex: 1; white-space: normal; overflow-wrap: anywhere; }
  .expense-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .expense-amt { flex-shrink: 0; font-variant-numeric: tabular-nums; color: var(--ink); }
  .expense-shared { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-soft); cursor: pointer; white-space: nowrap; }
  .expense-shared input { cursor: pointer; }
  .expense-shared.edited { color: var(--amber); font-weight: 600; }
  .expense-cat-select { font-size: 12px; max-width: 150px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); padding: 2px 4px; }
  .expense-cat-select.edited { border-color: var(--amber); background: var(--amber-bg); }
  .no-expenses { margin: 4px 0; font-size: 12px; color: var(--ink-muted); }
  .pending-bar {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    background: var(--ink); color: var(--paper); border-radius: 10px;
    padding: 10px 14px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    z-index: 10;
  }
  .pending-bar button {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--paper);
    border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  .split-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .split-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
  .split-row:last-of-type { margin-bottom: 0; }
  .split-inputs { display: flex; flex-wrap: wrap; gap: 16px; margin: 14px 0 4px; }
  .split-input-group { flex: 1; min-width: 0; }
  .split-input-group label { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .split-input-group input, .split-input-group select {
    width: 100%; font: inherit; font-variant-numeric: tabular-nums;
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper); color: var(--ink);
  }
  .split-input-group select { max-width: 200px; }
  .split-result {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 14px; font-weight: 600; text-align: center; color: var(--ink);
  }
  .split-result.settled { color: var(--green); }
  .split-note { font-size: 11px; color: var(--ink-muted); margin-top: 8px; text-align: center; }
  .overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
  .overview-grid > div { min-width: 0; }
  @media (max-width: 560px) { .overview-grid { grid-template-columns: 1fr; } }
  .overview-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .overview-card h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
  .overview-true-net { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-weight: 600; }
  .overview-section-gap { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .value-positive { color: var(--green); }
  .value-negative { color: var(--red); }
  .budget-editor { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .budget-editor label { color: var(--ink-soft); flex-shrink: 0; }
  .budget-editor input {
    width: 90px; font: inherit; font-variant-numeric: tabular-nums; padding: 4px 6px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
  }
  .budget-save-btn {
    font: inherit; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  }
  .budget-save-btn:disabled { cursor: default; opacity: 0.6; }
  .budget-save-status { font-size: 11px; color: var(--ink-muted); }
  .budget-save-status.error { color: var(--red); }
  .budget-save-status.success { color: var(--green); }
  .add-category-actions { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .add-category-actions button {
    font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  }
  .add-category-actions button:disabled { cursor: default; opacity: 0.6; }
  #refresh-btn {
    font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  #refresh-btn:disabled { cursor: default; opacity: 0.6; }
  #status-message {
    font: inherit; font-size: 12px; white-space: pre-wrap; margin: 16px auto 0; max-width: 760px;
    padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
  }
  #status-message.error { color: var(--red); background: var(--red-bg); border-color: #f0c9c9; }
  #status-message.success { color: var(--green); background: var(--green-bg); border-color: #b9e5d4; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Our budget</h1>
    <div class="header-right">
      <span class="month-label" id="month-label"></span>
      <button type="button" id="refresh-btn">Refresh</button>
    </div>
  </header>
  <div id="app"></div>
  <p class="generated-note" id="generated-note"></p>
  <pre id="status-message" hidden></pre>
</div>
<div class="pending-bar" id="pending-bar" hidden>
  <span class="pending-count"></span>
  <button type="button" id="save-changes-btn">Save changes</button>
  <button type="button" id="download-edits-btn">Download changes</button>
</div>

<script>
// Data is baked in at generation/serve time. When opened as a static file
// (build_dashboard.py's output) there's nothing to fetch from and Refresh /
// Save changes will just fail with a clear network error — Download changes
// still works. When served by server.py, Refresh and Save changes hit its
// /api/* routes and DATA gets reassigned in place.
let DATA = __DASHBOARD_DATA__;

function fmt(n) {
  const v = Math.round(Number(n) || 0);
  return (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString();
}

function statusLabel(status) {
  if (status === "unbudgeted") return "No budget set — needs review";
  return status === "over" ? "Over budget" : status === "close" ? "Close to limit" : "On track";
}

function setStatusMessage(text, isError) {
  const el = document.getElementById("status-message");
  if (!text) {
    el.hidden = true;
    el.textContent = "";
    el.classList.remove("error", "success");
    return;
  }
  el.hidden = false;
  el.textContent = text;
  el.classList.toggle("error", !!isError);
  el.classList.toggle("success", !isError);
}

// A page opened as a local file (build_dashboard.py's static export, or a
// leftover browser tab from it) has no server to fetch from — surface that
// plainly instead of letting it fail as a generic "Failed to fetch".
const STATIC_FILE_MESSAGE =
  "This is a static snapshot (opened as a local file), so it can't refresh or save live. " +
  "Run ./run_budget.sh serve and use the page it opens (http://127.0.0.1:5151/) instead.";

// Every API call goes through this so a stale server process (e.g. one
// still running from before a route was added — Flask doesn't hot-reload
// without debug mode) fails with a clear, actionable message instead of a
// raw "Unexpected token '<'" from trying to JSON-parse an HTML error page.
async function apiFetch(url, options) {
  let res;
  try {
    res = await fetch(url, options);
  } catch (err) {
    throw new Error(`Could not reach the server: ${err.message}`);
  }

  const contentType = res.headers.get("content-type") || "";
  if (!contentType.includes("application/json")) {
    const text = (await res.text()).trim();
    if (res.status === 404 || text.toLowerCase().startsWith("<!doctype")) {
      throw new Error(
        "Server returned an unexpected page — it's likely running old code. " +
        "Restart it (Ctrl+C, then ./run_budget.sh serve) and reload this page."
      );
    }
    throw new Error(`Unexpected response (status ${res.status}): ${text.slice(0, 200)}`);
  }

  const body = await res.json();
  if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}

async function refreshData() {
  if (location.protocol === "file:") {
    setStatusMessage(STATIC_FILE_MESSAGE, true);
    return;
  }
  const btn = document.getElementById("refresh-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Refreshing…"; }
  try {
    DATA = await apiFetch("/api/data");
    render(DATA);
  } catch (err) {
    setStatusMessage(`Could not refresh: ${err.message}`, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Refresh"; }
  }
}

async function saveChanges() {
  const edits = Object.values(pendingEdits);
  if (edits.length === 0) return;
  if (location.protocol === "file:") {
    setStatusMessage(STATIC_FILE_MESSAGE, true);
    return;
  }
  const btn = document.getElementById("save-changes-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    const body = await apiFetch("/api/edits", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(edits),
    });

    // Only clear edits the server actually applied — anything it skipped
    // stays staged and visibly flagged, never silently dropped.
    const skippedRows = new Set((body.skipped || []).map(s => s.row));
    for (const row of Object.keys(pendingEdits).map(Number)) {
      if (!skippedRows.has(row)) delete pendingEdits[row];
    }
    updatePendingBar();

    if (body.skipped && body.skipped.length > 0) {
      const lines = body.skipped.map(s => `Row ${s.row} (${s.description}): ${s.reason}`);
      setStatusMessage(`Saved ${body.applied} change(s). Skipped ${body.skipped.length}:\n${lines.join("\n")}`, true);
    } else {
      setStatusMessage(`Saved ${body.applied} change(s).`, false);
    }
    await refreshData();
  } catch (err) {
    setStatusMessage(`Could not save changes: ${err.message}`, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Save changes"; }
  }
}

// Edit staging: a transaction's new category or Shared flag never gets
// written to the Sheet from here — this only builds a JSON file for
// apply_category_edits.py to apply later, so the write credential never has
// to live in the browser. A row can carry a category change, a Shared
// change, or both — fields are merged in and pruned independently.
// sheet row -> {row, date, description, amount, person, [oldCategory, newCategory], [oldShared, newShared]}
const pendingEdits = {};
let rowIdCounter = 0;

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function txForCategory(category, personFilter) {
  return (DATA.transactions || []).filter(t =>
    t.category === category && (personFilter === null || t.person === personFilter));
}

function renderExpenseRow(t) {
  const options = DATA.categories.map(c =>
    `<option value="${escapeHtml(c)}"${c === t.category ? " selected" : ""}>${escapeHtml(c)}</option>`
  ).join("");
  return `
    <div class="expense-row">
      <div class="expense-info">
        <span class="expense-date">${escapeHtml(t.date)}</span>
        <span class="expense-desc" title="${escapeHtml(t.description)}">${escapeHtml(t.description)}</span>
      </div>
      <div class="expense-controls">
        <span class="expense-amt">${fmt(t.amount)}</span>
        <label class="expense-shared">
          <input type="checkbox" class="expense-shared-toggle"
            data-row="${t.row}" data-date="${escapeHtml(t.date)}"
            data-description="${escapeHtml(t.description)}" data-amount="${t.rawAmount}"
            data-person="${escapeHtml(t.person)}" data-orig-shared="${t.shared ? "1" : "0"}"
            ${t.shared ? "checked" : ""}>
          Shared
        </label>
        <select class="expense-cat-select"
          data-row="${t.row}" data-date="${escapeHtml(t.date)}"
          data-description="${escapeHtml(t.description)}" data-amount="${t.rawAmount}"
          data-person="${escapeHtml(t.person)}" data-orig="${escapeHtml(t.category)}">
          ${options}
          <option value="__new__">+ New category…</option>
        </select>
      </div>
    </div>`;
}

function renderSplitSection(data) {
  const people = data.peopleOrder || [];
  if (people.length !== 2) return "";
  const [a, b] = people;
  const shared = data.sharedExpenses || { total: 0, paidByPerson: {} };
  const paidA = shared.paidByPerson[a] || 0;
  const paidB = shared.paidByPerson[b] || 0;
  const trackedIncomeA = Math.round((data.people[a] && data.people[a].income) || 0);
  const trackedIncomeB = Math.round((data.people[b] && data.people[b].income) || 0);
  const storedA = Number(localStorage.getItem("splitIncome_" + a));
  const storedB = Number(localStorage.getItem("splitIncome_" + b));
  const startA = storedA > 0 ? storedA : trackedIncomeA;
  const startB = storedB > 0 ? storedB : trackedIncomeB;
  const storedMode = localStorage.getItem("splitMode");
  const startMode = storedMode === "even" ? "even" : "income";

  return `
    <div class="section">
      <h2>Shared expenses — split &amp; settle up</h2>
      <div class="split-card">
        <div class="split-row"><span>Total shared spending this month</span><span>${fmt(shared.total)}</span></div>
        <div class="split-row"><span>Paid by ${escapeHtml(a)}</span><span>${fmt(paidA)}</span></div>
        <div class="split-row"><span>Paid by ${escapeHtml(b)}</span><span>${fmt(paidB)}</span></div>
        <div class="split-input-group">
          <label for="split-mode">Split ratio</label>
          <select id="split-mode">
            <option value="income"${startMode === "income" ? " selected" : ""}>By income</option>
            <option value="even"${startMode === "even" ? " selected" : ""}>50 / 50</option>
          </select>
        </div>
        <div class="split-inputs">
          <div class="split-input-group">
            <label for="split-income-a">${escapeHtml(a)}'s income</label>
            <input type="number" id="split-income-a" min="0" step="1" value="${startA}">
          </div>
          <div class="split-input-group">
            <label for="split-income-b">${escapeHtml(b)}'s income</label>
            <input type="number" id="split-income-b" min="0" step="1" value="${startB}">
          </div>
        </div>
        <div class="split-result" id="split-result"></div>
        <p class="split-note" id="split-note"></p>
      </div>
      <div class="overview-grid">
        <div class="overview-card">
          <h3>${escapeHtml(a)} — overview</h3>
          <div class="split-row"><span>Income</span><span id="overview-income-a"></span></div>
          <div class="split-row"><span>Personal spending</span><span id="overview-personal-a"></span></div>
          <div class="split-row"><span>Fair share of shared costs</span><span id="overview-fairshare-a"></span></div>
          <div class="split-row overview-true-net"><span>True net this month</span><span id="overview-truenet-a"></span></div>
          <div class="split-row overview-section-gap"><span>Expected income</span><span id="overview-expected-income-a"></span></div>
          <div class="split-row"><span>Budgeted expenses</span><span id="overview-budgeted-expenses-a"></span></div>
          <div class="split-row overview-true-net"><span>Budget surplus / deficit</span><span id="overview-budget-diff-a"></span></div>
        </div>
        <div class="overview-card">
          <h3>${escapeHtml(b)} — overview</h3>
          <div class="split-row"><span>Income</span><span id="overview-income-b"></span></div>
          <div class="split-row"><span>Personal spending</span><span id="overview-personal-b"></span></div>
          <div class="split-row"><span>Fair share of shared costs</span><span id="overview-fairshare-b"></span></div>
          <div class="split-row overview-true-net"><span>True net this month</span><span id="overview-truenet-b"></span></div>
          <div class="split-row overview-section-gap"><span>Expected income</span><span id="overview-expected-income-b"></span></div>
          <div class="split-row"><span>Budgeted expenses</span><span id="overview-budgeted-expenses-b"></span></div>
          <div class="split-row overview-true-net"><span>Budget surplus / deficit</span><span id="overview-budget-diff-b"></span></div>
        </div>
      </div>
    </div>`;
}

function updateSplitResult(data) {
  const people = data.peopleOrder || [];
  if (people.length !== 2) return;
  const [a, b] = people;
  const inputA = document.getElementById("split-income-a");
  const inputB = document.getElementById("split-income-b");
  const modeSelect = document.getElementById("split-mode");
  const result = document.getElementById("split-result");
  if (!inputA || !inputB || !result) return;

  const incomeA = Math.max(0, Number(inputA.value) || 0);
  const incomeB = Math.max(0, Number(inputB.value) || 0);
  localStorage.setItem("splitIncome_" + a, String(incomeA));
  localStorage.setItem("splitIncome_" + b, String(incomeB));

  const splitMode = modeSelect ? modeSelect.value : "income";
  localStorage.setItem("splitMode", splitMode);

  const shared = data.sharedExpenses || { total: 0, paidByPerson: {} };
  const paidA = shared.paidByPerson[a] || 0;
  const paidB = shared.paidByPerson[b] || 0;
  const totalIncome = incomeA + incomeB;
  // "Expected income" (below) always reflects whatever's actually typed into
  // the income boxes — the split ratio is a separate choice, so switching to
  // 50/50 here doesn't require faking equal income values just to force it.
  const shareA = splitMode === "even" ? 0.5 : (totalIncome > 0 ? incomeA / totalIncome : 0.5);
  const fairA = shared.total * shareA;
  const fairB = shared.total * (1 - shareA);
  const balanceA = paidA - fairA; // positive: A paid more than their fair share

  const noteEl = document.getElementById("split-note");
  if (noteEl) {
    noteEl.textContent = splitMode === "even"
      ? `Includes every transaction below marked "Shared", regardless of category. Costs are split evenly 50/50, regardless of income.`
      : `Includes every transaction below marked "Shared", regardless of category. Costs are split in proportion to the incomes below (e.g. if ${b} earns 1.2x ${a}, ${b} covers 1.2x the share). Defaults to this month's tracked income — edit either number to try a different ratio.`;
  }

  result.classList.remove("settled");
  if (Math.abs(balanceA) < 1) {
    result.textContent = "All settled up";
    result.classList.add("settled");
  } else if (balanceA > 0) {
    result.textContent = `${b} owes ${a} ${fmt(balanceA)}`;
  } else {
    result.textContent = `${a} owes ${b} ${fmt(-balanceA)}`;
  }

  // Individual overview: actual tracked income (not the ratio inputs above,
  // which may be a deliberately hypothetical ratio for splitting purposes)
  // minus personal (non-shared) spending minus this person's fair share of
  // shared costs at whatever ratio is currently set.
  const trackedA = (data.people[a] && data.people[a].income) || 0;
  const trackedB = (data.people[b] && data.people[b].income) || 0;
  const personalA = (data.people[a] && data.people[a].expenses) || 0;
  const personalB = (data.people[b] && data.people[b].expenses) || 0;
  const trueNetA = trackedA - personalA - fairA;
  const trueNetB = trackedB - personalB - fairB;

  setText("overview-income-a", fmt(trackedA));
  setText("overview-personal-a", fmt(personalA));
  setText("overview-fairshare-a", fmt(fairA));
  setSignedText("overview-truenet-a", trueNetA);

  setText("overview-income-b", fmt(trackedB));
  setText("overview-personal-b", fmt(personalB));
  setText("overview-fairshare-b", fmt(fairB));
  setSignedText("overview-truenet-b", trueNetB);

  // Budget-vs-income check: does the plan add up, not just this month's
  // actuals? "Expected income" here is the SAME number you typed into the
  // "'s income" boxes above (incomeA/incomeB) — that's the explicit figure
  // you're actually editing, not the separate per-income-category budgets
  // in the "Income sources" section below. Reuses shareA (same ratio as the
  // actual settle-up split above) for the household budget's fair share, so
  // both halves of this check come from the one number you set.
  const expectedIncomeA = incomeA;
  const expectedIncomeB = incomeB;

  const personalBudgetA = sumBudgets(data.people[a] && data.people[a].categories);
  const personalBudgetB = sumBudgets(data.people[b] && data.people[b].categories);
  const householdBudgetTotal = sumBudgets(data.household);
  const fairShareBudgetA = householdBudgetTotal * shareA;
  const fairShareBudgetB = householdBudgetTotal * (1 - shareA);
  const budgetedExpensesA = personalBudgetA + fairShareBudgetA;
  const budgetedExpensesB = personalBudgetB + fairShareBudgetB;

  setText("overview-expected-income-a", fmt(expectedIncomeA));
  setText("overview-budgeted-expenses-a", fmt(budgetedExpensesA));
  setSignedText("overview-budget-diff-a", expectedIncomeA - budgetedExpensesA);

  setText("overview-expected-income-b", fmt(expectedIncomeB));
  setText("overview-budgeted-expenses-b", fmt(budgetedExpensesB));
  setSignedText("overview-budget-diff-b", expectedIncomeB - budgetedExpensesB);
}

function renderIncomeCategoryRow(item, owner) {
  return `
    <div class="row">
      <div class="row-top">
        <span>${escapeHtml(item.category)}</span>
        <span class="row-amounts">${fmt(item.actual)} received</span>
      </div>
      ${renderBudgetEditor(item.category, owner, item.budget, "Target")}
    </div>`;
}

function renderIncomeSection(data) {
  const owners = data.peopleOrder || Object.keys(data.people || {});
  if (owners.length === 0) return "";

  const cardsHtml = owners.map(owner => {
    const p = data.people[owner] || {};
    const items = p.incomeCategories || [];
    const rowsHtml = items.length
      ? items.map(item => renderIncomeCategoryRow(item, owner)).join("")
      : `<p class="no-expenses">No income tracked this month.</p>`;
    return `<div class="overview-card"><h3>${escapeHtml(owner)}</h3>${rowsHtml}</div>`;
  }).join("");

  return `
    <div class="section">
      <h2>Income sources</h2>
      <div class="overview-grid">${cardsHtml}</div>
      <p class="split-note">
        Per-source tracking only — the "Expected income" used in the overview above comes from the
        "'s income" boxes in the split calculator, not the targets set here.
      </p>
    </div>`;
}

function renderAddCategorySection(data) {
  const owners = ["Household", ...(data.peopleOrder || [])];
  const ownerOptions = owners.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("");
  return `
    <div class="section">
      <h2>Add a category</h2>
      <div class="split-card">
        <div class="split-inputs">
          <div class="split-input-group">
            <label for="new-cat-name">Name</label>
            <input type="text" id="new-cat-name" placeholder="e.g. Car Repair">
          </div>
          <div class="split-input-group">
            <label for="new-cat-owner">Owner</label>
            <select id="new-cat-owner">${ownerOptions}</select>
          </div>
          <div class="split-input-group">
            <label for="new-cat-type">Type</label>
            <select id="new-cat-type">
              <option value="Expense">Expense</option>
              <option value="Income">Income</option>
              <option value="Transfer">Transfer</option>
            </select>
          </div>
          <div class="split-input-group">
            <label for="new-cat-budget">Monthly budget</label>
            <input type="number" id="new-cat-budget" min="0" step="1" value="0">
          </div>
        </div>
        <div class="add-category-actions">
          <button type="button" id="add-category-btn">Add category</button>
          <span class="budget-save-status" id="add-category-status"></span>
        </div>
      </div>
    </div>`;
}

function setText(id, text) {
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

function setSignedText(id, value) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = (value >= 0 ? "+" : "") + fmt(value);
  el.classList.toggle("value-positive", value >= 0);
  el.classList.toggle("value-negative", value < 0);
}

function sumBudgets(items) {
  return (items || []).reduce((sum, item) => sum + (item.budget || 0), 0);
}

function renderBudgetEditor(category, owner, budget, label) {
  return `
    <div class="budget-editor">
      <label>${escapeHtml(label || "Monthly budget")}</label>
      <input type="number" class="budget-input" min="0" step="1"
        data-category="${escapeHtml(category)}" data-owner="${escapeHtml(owner)}"
        data-orig="${budget}" value="${budget}">
      <button type="button" class="budget-save-btn" hidden>Save</button>
      <span class="budget-save-status"></span>
    </div>`;
}

function renderRow(item, personFilter) {
  const pct = item.budget > 0 ? Math.max(0, Math.min(item.actual / item.budget, 1) * 100) : 0;
  const amounts = item.status === "unbudgeted" ? fmt(item.actual) : `${fmt(item.actual)} / ${fmt(item.budget)}`;
  const expenses = txForCategory(item.category, personFilter);
  const listId = `expenses-${rowIdCounter++}`;
  const expensesHtml = expenses.length
    ? expenses.map(renderExpenseRow).join("")
    : `<p class="no-expenses">No transactions this month.</p>`;
  const owner = personFilter === null ? "Household" : personFilter;
  return `
    <div class="row">
      <div class="row-top clickable" data-toggle="${listId}">
        <span>${escapeHtml(item.category)}</span>
        <span class="row-amounts">${amounts}</span>
      </div>
      <div class="track"><div class="bar ${item.status}" style="width:${pct}%"></div></div>
      <p class="status-label ${item.status}">${statusLabel(item.status)}</p>
      <div class="expense-list" id="${listId}" hidden>
        ${renderBudgetEditor(item.category, owner, item.budget)}
        ${expensesHtml}
      </div>
    </div>`;
}

function updatePendingBar() {
  const count = Object.keys(pendingEdits).length;
  const bar = document.getElementById("pending-bar");
  if (count === 0) {
    bar.hidden = true;
    return;
  }
  bar.hidden = false;
  bar.querySelector(".pending-count").textContent =
    `${count} change${count === 1 ? "" : "s"} pending`;
}

function downloadPendingEdits() {
  const edits = Object.values(pendingEdits);
  if (edits.length === 0) return;
  const blob = new Blob([JSON.stringify(edits, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().replace(/[:.]/g, "-");
  const a = document.createElement("a");
  a.href = url;
  a.download = `category-edits_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function handleBudgetInputChange(input) {
  const container = input.closest(".budget-editor");
  if (!container) return;
  const saveBtn = container.querySelector(".budget-save-btn");
  const status = container.querySelector(".budget-save-status");
  saveBtn.hidden = String(input.value) === String(input.dataset.orig);
  status.textContent = "";
  status.classList.remove("error", "success");
}

async function saveBudgetEdit(btn) {
  const container = btn.closest(".budget-editor");
  const input = container.querySelector(".budget-input");
  const status = container.querySelector(".budget-save-status");
  const category = input.dataset.category;
  const owner = input.dataset.owner;
  const budget = Number(input.value);

  status.textContent = "";
  status.classList.remove("error", "success");

  if (isNaN(budget) || budget < 0) {
    status.textContent = "Enter a valid non-negative number.";
    status.classList.add("error");
    return;
  }
  if (location.protocol === "file:") {
    status.textContent = STATIC_FILE_MESSAGE;
    status.classList.add("error");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Saving…";
  try {
    const body = await apiFetch("/api/categories", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify([{ category, owner, budget }]),
    });
    if (body.errors && body.errors.length > 0) throw new Error(body.errors[0].reason);

    input.dataset.orig = String(budget);
    btn.hidden = true;
    status.textContent = "Saved";
    status.classList.add("success");
    await refreshData();
  } catch (err) {
    status.textContent = `Could not save: ${err.message}`;
    status.classList.add("error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Save";
  }
}

async function addCategory() {
  const nameInput = document.getElementById("new-cat-name");
  const ownerInput = document.getElementById("new-cat-owner");
  const typeInput = document.getElementById("new-cat-type");
  const budgetInput = document.getElementById("new-cat-budget");
  const status = document.getElementById("add-category-status");
  const btn = document.getElementById("add-category-btn");

  const category = nameInput.value.trim();
  const owner = ownerInput.value;
  const type = typeInput.value;
  const budget = Number(budgetInput.value);

  status.textContent = "";
  status.classList.remove("error", "success");

  if (!category) {
    status.textContent = "Enter a category name.";
    status.classList.add("error");
    return;
  }
  if (isNaN(budget) || budget < 0) {
    status.textContent = "Enter a valid non-negative budget.";
    status.classList.add("error");
    return;
  }
  if (location.protocol === "file:") {
    status.textContent = STATIC_FILE_MESSAGE;
    status.classList.add("error");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Adding…";
  try {
    const body = await apiFetch("/api/categories", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify([{ category, owner, budget, type }]),
    });
    if (body.errors && body.errors.length > 0) throw new Error(body.errors[0].reason);

    status.textContent = `Added "${category}".`;
    status.classList.add("success");
    nameInput.value = "";
    budgetInput.value = "0";
    await refreshData();
  } catch (err) {
    status.textContent = `Could not add category: ${err.message}`;
    status.classList.add("error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Add category";
  }
}

function handleAppClick(e) {
  const toggle = e.target.closest(".row-top.clickable");
  if (toggle) {
    const list = document.getElementById(toggle.dataset.toggle);
    if (list) list.hidden = !list.hidden;
    return;
  }
  const saveBudgetBtn = e.target.closest(".budget-save-btn");
  if (saveBudgetBtn) {
    saveBudgetEdit(saveBudgetBtn);
    return;
  }
  const addCategoryBtn = e.target.closest("#add-category-btn");
  if (addCategoryBtn) {
    addCategory();
  }
}

function ensurePendingEdit(dataset) {
  const row = Number(dataset.row);
  if (!pendingEdits[row]) {
    pendingEdits[row] = {
      row,
      date: dataset.date,
      description: dataset.description,
      amount: Number(dataset.amount),
      person: dataset.person,
    };
  }
  return pendingEdits[row];
}

function prunePendingEdit(row) {
  const edit = pendingEdits[row];
  if (edit && !("newCategory" in edit) && !("newShared" in edit)) {
    delete pendingEdits[row];
  }
}

function handleCategoryChange(select) {
  let newCategory = select.value;
  if (newCategory === "__new__") {
    const typed = prompt("New category name:");
    if (!typed || !typed.trim()) {
      select.value = select.dataset.orig;
      return;
    }
    newCategory = typed.trim();
    const opt = document.createElement("option");
    opt.value = newCategory;
    opt.textContent = newCategory;
    opt.selected = true;
    select.insertBefore(opt, select.lastElementChild);
  }

  const row = Number(select.dataset.row);
  const edit = ensurePendingEdit(select.dataset);
  if (newCategory === select.dataset.orig) {
    delete edit.newCategory;
    delete edit.oldCategory;
    select.classList.remove("edited");
  } else {
    edit.oldCategory = select.dataset.orig;
    edit.newCategory = newCategory;
    select.classList.add("edited");
  }
  prunePendingEdit(row);
  updatePendingBar();
}

function handleSharedToggle(checkbox) {
  const row = Number(checkbox.dataset.row);
  const origShared = checkbox.dataset.origShared === "1";
  const newShared = checkbox.checked;
  const label = checkbox.closest(".expense-shared");
  const edit = ensurePendingEdit(checkbox.dataset);
  if (newShared === origShared) {
    delete edit.newShared;
    delete edit.oldShared;
    if (label) label.classList.remove("edited");
  } else {
    edit.oldShared = origShared;
    edit.newShared = newShared;
    if (label) label.classList.add("edited");
  }
  prunePendingEdit(row);
  updatePendingBar();
}

function handleAppChange(e) {
  if (e.target.id === "split-mode") {
    updateSplitResult(DATA);
    return;
  }
  const select = e.target.closest(".expense-cat-select");
  if (select) {
    handleCategoryChange(select);
    return;
  }
  const checkbox = e.target.closest(".expense-shared-toggle");
  if (checkbox) {
    handleSharedToggle(checkbox);
  }
}

function render(data) {
  document.getElementById("month-label").textContent = data.month;

  // Object.keys(data.people) is not stable across server restarts — the
  // dict is built by iterating a Python set, whose order depends on hash
  // randomization. peopleOrder is derived from config.PEOPLE, always in the
  // same fixed order.
  const peopleNames = data.peopleOrder || Object.keys(data.people);
  const peopleHtml = peopleNames.map(name => {
    const p = data.people[name];
    return `<div><h2>${name}</h2>${p.categories.map(item => renderRow(item, name)).join("")}</div>`;
  }).join("");

  const warningHtml = (data.unmatched && data.unmatched.length > 0) ? `
    <div class="warning-box">
      <p>⚠ Unmatched person values</p>
      ${data.unmatched.map(u => `<div>"${escapeHtml(u.name)}" — ${fmt(u.amount)}</div>`).join("")}
    </div>` : "";

  document.getElementById("app").innerHTML = `
    <div class="section">
      <h2>Household — combined</h2>
      ${data.household.map(item => renderRow(item, null)).join("")}
    </div>
    ${renderSplitSection(data)}
    ${renderIncomeSection(data)}
    <div class="section people-grid">${peopleHtml}</div>
    ${renderAddCategorySection(data)}
    <div class="metrics">
      <div class="metric">
        <p class="metric-label">Combined income</p>
        <p class="metric-value">${fmt(data.combined.income)}</p>
      </div>
      <div class="metric">
        <p class="metric-label">Combined expenses</p>
        <p class="metric-value">${fmt(data.combined.expenses)}</p>
      </div>
      <div class="metric positive">
        <p class="metric-label">Net this month</p>
        <p class="metric-value">${data.combined.net >= 0 ? "+" : ""}${fmt(data.combined.net)}</p>
      </div>
    </div>
    ${warningHtml}
  `;
  updateSplitResult(data);
}

function handleAppInput(e) {
  if (e.target.id === "split-income-a" || e.target.id === "split-income-b") {
    updateSplitResult(DATA);
    return;
  }
  const budgetInput = e.target.closest(".budget-input");
  if (budgetInput) {
    handleBudgetInputChange(budgetInput);
  }
}

render(DATA);
document.getElementById("generated-note").textContent =
  "Generated locally by build_dashboard.py — re-run it any time after a new import.";

document.getElementById("app").addEventListener("click", handleAppClick);
document.getElementById("app").addEventListener("change", handleAppChange);
document.getElementById("app").addEventListener("input", handleAppInput);
document.getElementById("download-edits-btn").addEventListener("click", downloadPendingEdits);
document.getElementById("save-changes-btn").addEventListener("click", saveChanges);
document.getElementById("refresh-btn").addEventListener("click", () => {
  setStatusMessage("");
  refreshData();
});
</script>
</body>
